<script>
(function(){
 var M=JSON.parse(document.getElementById('meta').textContent),KEY='vlab.konzept.key';
 function b2u(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
 function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
 function derive(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:b2u(M.s),iterations:M.n,hash:'SHA-256'},k,256)}).then(function(b){return new Uint8Array(b)})}
 function open(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(M.i)},k,b2u(document.getElementById('data').textContent.trim()))}).then(function(buf){var html=new TextDecoder().decode(buf);return new Promise(function(res){var go=function(){setTimeout(function(){document.open();document.write(html);document.close();res()},0)};if(document.readyState==='complete')go();else window.addEventListener('load',go)})})}
 function saved(){try{return localStorage.getItem(KEY)||sessionStorage.getItem(KEY)}catch(e){return null}}

 if(!window.crypto||!crypto.subtle){msg.textContent='Dieser Browser kann die Seite nicht entschlüsseln. Bitte über https öffnen.';go.disabled=true;return}
 var s=saved();if(s){f.style.visibility='hidden';open(b2u(s)).catch(function(){f.style.visibility='';try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY)}catch(e){}})}
